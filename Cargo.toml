[workspace]
resolver = "2"
members = [
    "crates/fd-core",
    "crates/fd-aircraft",
    "crates/fd-sop",
    "crates/fd-fdm",
    "crates/fd-virtual",
    "crates/fd-mission",
    "crates/fd-scenario",
    "crates/fd-xplane",
    "crates/fd-simconnect",
    "crates/fd-runtime",
    "crates/fd-app",
    "crates/fd-openairac",
    "crates/fd-crew",
    "crates/fd-debrief",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tempfile = "3"

[profile.release]
lto = "thin"
