[workspace]
resolver = "2"
members = [
    "crates/fd-core",
    "crates/fd-aircraft",
    "crates/fd-sop",
    "crates/fd-simconnect",
    "crates/fd-runtime",
    "crates/fd-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
