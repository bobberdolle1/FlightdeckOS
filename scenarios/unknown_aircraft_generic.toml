# FlightdeckOS headless scenario — UNKNOWN AIRCRAFT (no package).
#
# First proof of the future IL-76-style use case: an aircraft identity with
# no package still gets telemetry, FDR, basic FDM and mission progression
# through the virtual adapter's generic flight-guidance capability.
# SOP/procedure capabilities are UNAVAILABLE — nothing is invented.

[scenario]
id = "unknown-aircraft-generic"
# NOTE: no package -> Generic mode.

[origin]
id = "UUEE"
lat_deg = 55.972642
lon_deg = 37.414589
elevation_ft = 622.0

[destination]
id = "ULLI"
lat_deg = 59.800278
lon_deg = 30.2625
elevation_ft = 79.0

[initial_conditions]
heading_deg = 330.0
engines_running = true
on_ground = true

[mission]
cruise_altitude_ft = 30000.0

[simulation]
dt_ms = 100
max_sim_seconds = 7200
